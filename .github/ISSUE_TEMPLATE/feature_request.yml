name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [Roadmap](../../README.md#roadmap) first — it may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? What's missing or awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to see instead? Be as concrete as you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about, and why you'd prefer the proposal above.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might be relevant (screenshots, related issues, etc.).
