name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: frontend (lint · typecheck · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      - run: pnpm test
      # The TanStack Router plugin writes src/routeTree.gen.ts during the
      # build; a diff means someone added or renamed a route file without
      # committing the regen (SHELL_CHEATSHEET §1).
      - run: pnpm exec vite build
      - run: git diff --exit-code src/routeTree.gen.ts

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux WebKit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # Tauri's build script resolves the sidecars and the bundled Python
      # interpreter from disk before compiling a line of Rust, and both are
      # gitignored — they are built per machine and the interpreter alone is
      # ~500MB (see .gitignore, PACKAGING_DESIGN.md section A). A fresh
      # checkout therefore dies with `resource path
      # binaries/mnemos-audio-... doesn't exist` before clippy or the tests
      # ever run, which is why every Rust job here had never once passed.
      #
      # These jobs lint and test; they never bundle a shippable app. Empty
      # files at the paths the build script probes satisfy it and are never
      # executed. Anything that actually needs working sidecars — a real
      # build, a release — must produce them properly instead
      # (scripts/build_macos_app.sh).
      - name: Stub gitignored sidecars and interpreter
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            mkdir -p src-tauri/binaries src-tauri/bundled/python-macos-arm64
            # `externalBin` entries are resolved with the target triple
            # appended; macos-14 runners are arm64.
            for b in mnemos-audio mnemos-meeting-watcher; do
              : > "src-tauri/binaries/$b-aarch64-apple-darwin"
              chmod +x "src-tauri/binaries/$b-aarch64-apple-darwin"
            done
            : > src-tauri/bundled/python-macos-arm64/.ci-placeholder
          else
            mkdir -p src-tauri/bundled/python-windows-x64
            : > src-tauri/bundled/python-windows-x64/.ci-placeholder
          fi

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  version-consistency:
    name: package.json and Cargo.toml versions match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # tauri.conf.json has no "version" field — Tauri reads it from
      # Cargo.toml at build time, so Cargo.toml is the single source of
      # truth for the app version. package.json still needs its own
      # version field (npm has no equivalent fallback), so this just
      # catches drift between the two rather than eliminating the second
      # field outright.
      - name: Compare package.json and Cargo.toml versions
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          CARGO_VERSION=$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "package.json: $PKG_VERSION"
          echo "Cargo.toml:   $CARGO_VERSION"
          if [ "$PKG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) and Cargo.toml version ($CARGO_VERSION) must match"
            exit 1
          fi

  bindings:
    name: specta bindings are committed
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Tauri's build script resolves the sidecars and the bundled Python
      # interpreter from disk before compiling a line of Rust, and both are
      # gitignored — they are built per machine and the interpreter alone is
      # ~500MB (see .gitignore, PACKAGING_DESIGN.md section A). A fresh
      # checkout therefore dies with `resource path
      # binaries/mnemos-audio-... doesn't exist` before clippy or the tests
      # ever run, which is why every Rust job here had never once passed.
      #
      # These jobs lint and test; they never bundle a shippable app. Empty
      # files at the paths the build script probes satisfy it and are never
      # executed. Anything that actually needs working sidecars — a real
      # build, a release — must produce them properly instead
      # (scripts/build_macos_app.sh).
      - name: Stub gitignored sidecars and interpreter
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            mkdir -p src-tauri/binaries src-tauri/bundled/python-macos-arm64
            # `externalBin` entries are resolved with the target triple
            # appended; macos-14 runners are arm64.
            for b in mnemos-audio mnemos-meeting-watcher; do
              : > "src-tauri/binaries/$b-aarch64-apple-darwin"
              chmod +x "src-tauri/binaries/$b-aarch64-apple-darwin"
            done
            : > src-tauri/bundled/python-macos-arm64/.ci-placeholder
          else
            mkdir -p src-tauri/bundled/python-windows-x64
            : > src-tauri/bundled/python-windows-x64/.ci-placeholder
          fi

      # Regenerates bindings/tauri.ts; a diff means someone hand-edited the
      # file or forgot to commit a regen (FRONTEND §3).
      - run: cargo test specta_bindings
        working-directory: src-tauri
      - name: Fail if bindings drifted
        run: git diff --exit-code -- bindings/tauri.ts
