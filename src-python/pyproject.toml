[project]
name = "mnemos-worker"
version = "0.1.0"
description = "Mnemos persistent worker (W5 skeleton — no model/job handlers yet)"
requires-python = ">=3.11"
dependencies = [
    "structlog>=24.1",
    "numpy>=1.26",
    "pyaudiowpatch>=0.2.12.7; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mnemos_worker"]
