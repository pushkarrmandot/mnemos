[package]
name = "mnemos-tauri"
version = "0.1.0"
description = "Mnemos — local-first meeting memory"
edition = "2021"
rust-version = "1.80"
publish = false
license = "AGPL-3.0-or-later"
authors = ["pushkarmandot@gmail.com"]
repository = "https://github.com/pushkarmandot/mnemos"
# W16 added a second `[[bin]]` (`mnemos-mcp-server`) to this package, so
# `cargo run` can no longer infer which binary to launch — including the
# implicit `cargo run` the Tauri CLI shells out to on `pnpm tauri dev`.
# This pins the ambiguity to the app binary; run the MCP server explicitly
# via `cargo run --bin mnemos-mcp-server` when that's what you want.
default-run = "mnemos-tauri"

[lib]
# Tauri v2 mobile-ready shape: main.rs is a thin shim over the lib.
name = "mnemos_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# `mnemos-mcp-server` (W16 / LLD-08 §4) — a standalone binary in the SAME
# package (not a workspace crate: BACKEND_STANDARDS §1 "single crate, not a
# workspace" for the whole Rust side). It links `mnemos_tauri_lib`'s `rlib`
# output directly, the same as any other binary target in this package —
# no Tauri runtime, no window, no Python/Swift subprocess. See the binary's
# own module docs for why this differs from LLD-08 §5.2's "shared
# `mnemos-storage` crate" sketch.
[[bin]]
# Underscored to match the PDB/debug-info filename rustc derives from the
# crate name (hyphens aren't valid in Rust identifiers, so rustc always
# substitutes underscores there) — with a hyphenated bin name the .exe and
# .pdb disagreed, and the Tauri NSIS bundler resolves this binary's bundle
# entry by the underscored name, so a real `pnpm tauri build --bundles nsis`
# failed with "when getting size of ...mnemos_mcp_server.exe: The system
# cannot find the file specified" (it built mnemos-mcp-server.exe, hyphenated,
# and went looking for the underscored name). See mcp_shared.rs, which now
# looks for this same underscored name at runtime.
name = "mnemos_mcp_server"
path = "src/bin/mnemos-mcp-server/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `image-png` is what makes `Image::from_bytes` exist — the tray icons are
# PNGs compiled in via `include_bytes!` (see `commands::tray`).
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

specta = { version = "=2.0.0-rc.22", features = ["derive", "serde_json"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }

thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }

async-trait = "0.1"
regex-lite = "0.1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "process", "io-util", "io-std", "sync"] }
time = { version = "0.3", features = ["parsing", "formatting"] }
tokio-stream = "0.1"
futures-core = "0.3"
futures-util = "0.3"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Product analytics transport (`metrics` module) — the only network client
# in the codebase; rustls-only so the Tauri bundler never needs a system
# OpenSSL toolchain.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[features]
# Present so `tauri build --features custom-protocol` keeps working.
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
